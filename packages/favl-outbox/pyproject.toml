[project]
name = "favl-outbox"
version = "0.1.0"
description = "Transactional outbox with acknowledged JetStream publication"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy[asyncio]==2.0.43",
  "nats-py==2.11.0",
  "prometheus-client==0.22.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["favl_outbox*"]
