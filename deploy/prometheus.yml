global:
  scrape_interval: 15s

scrape_configs:
  - job_name: apisix
    metrics_path: /apisix/prometheus/metrics
    static_configs:
      - targets: ["apisix:9091"]
  - job_name: otel
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: nats
    static_configs:
      - targets: ["nats-exporter:7777"]
