name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first: CI feedback on stale
# code is worse than no feedback, because it invites acting on it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  python:
    name: Python — lint, types, tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-dev.txt
          touch .venv/.stamp

      - name: Lint (ruff check + format)
        run: make lint

      - name: Type-check (mypy --strict)
        run: make typecheck

      - name: Tests
        run: make test

  console:
    name: Console — types, lint, build, audit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/console/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production dependency audit
        # Dev-only advisories should not block a release; a vulnerable
        # dependency shipped in the runtime image should.
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

  compose:
    name: Deployment — config validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose configuration
        run: |
          cp .env.example .env
          docker compose --env-file .env -f deploy/docker-compose.yml config >/dev/null
          docker compose --env-file .env -f deploy/docker-compose.yml --profile dev config >/dev/null

      - name: Validate Prometheus rules and scrape config
        run: |
          docker run --rm -v "$PWD/deploy:/deploy" --entrypoint promtool \
            prom/prometheus:v3.5.0 check rules /deploy/prometheus-alerts.yml
          docker run --rm -v "$PWD/deploy:/deploy" --entrypoint promtool \
            prom/prometheus:v3.5.0 check config /deploy/prometheus.yml || true

      - name: Alert rules must reference metrics the code actually emits
        run: python3 scripts/check_alert_metrics.py

      - name: Container images must be pinned by digest
        run: python3 scripts/check_image_pins.py

      - name: Kubernetes manifests must parse
        run: |
          python3 -c "
          import sys, pathlib, yaml
          for f in sorted(pathlib.Path('deploy/kubernetes').glob('*.yaml')):
              docs = [d for d in yaml.safe_load_all(f.read_text()) if d]
              print(f'{f}: {len(docs)} manifests')
          "

  images:
    name: Images — build and scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: orchestrator
            dockerfile: services/orchestrator/Dockerfile
          - name: connector-registry
            dockerfile: services/connector-registry/Dockerfile
          - name: console
            dockerfile: apps/console/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: favl/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Two invocations on purpose. The SARIF upload is for triage and must
      # not fail the job; the gate below must. With only the reporting run,
      # trivy-action defaults exit-code to 0 and a CRITICAL CVE merged green
      # while CONTRIBUTING listed image scanning as enforced.
      - name: Scan image (report)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: favl/${{ matrix.name }}:ci
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Scan image (gate)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: favl/${{ matrix.name }}:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: image-${{ matrix.name }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: favl/${{ matrix.name }}:ci
          format: spdx-json
          artifact-name: sbom-${{ matrix.name }}.spdx.json

  hooks:
    name: Pre-commit hooks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # .pre-commit-config.yaml claims every hook also runs in CI. Nine of
      # them had no CI counterpart, so a large binary, a merge-conflict
      # marker or a private key could merge green.
      - run: pipx run pre-commit run --all-files --show-diff-on-failure

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a credential removed in a later commit is still
          # a credential that was published.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration:
    name: Integration — delivery guarantee and tenant isolation
    runs-on: ubuntu-24.04
    # Runs on pull requests too. Gating only pushes to main meant a change
    # that broke delivery or tenant isolation merged green and failed
    # afterwards, when the signal no longer blocks anything.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: |
          cp .env.example .env
          # Real secrets for the run; .env.example ships placeholders only.
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 24)|" .env
          sed -i "s|^INTERNAL_SERVICE_TOKEN=.*|INTERNAL_SERVICE_TOKEN=$(openssl rand -hex 32)|" .env
          docker compose --env-file .env -f deploy/docker-compose.yml --profile dev up -d --build
          timeout 180 bash -c 'until curl -sf http://localhost:9080/health/ready >/dev/null; do sleep 3; done'

      - name: Verify identity and tenant isolation
        run: bash tests/verify_identity.sh

      - name: Verify the transactional outbox
        run: bash tests/verify_outbox.sh

      - name: Service logs on failure
        if: failure()
        run: docker compose --env-file .env -f deploy/docker-compose.yml logs --tail=200
